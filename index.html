<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeOffice</title><link rel="stylesheet" href="style.css">
<style>
main { max-width:960px; margin:0 auto; padding:32px 16px; }
h1 { margin:0 0 4px; display:flex; align-items:center; gap:12px }
.logo { display:inline-flex; align-items:baseline; justify-content:center; padding-top:0; line-height:44px; width:44px; height:44px; border-radius:11px; background:#111; color:#fff; font:700 22px "Helvetica Neue",Helvetica,Arial,sans-serif; letter-spacing:-1px }
.logo small { font-size:15px; font-weight:700 }
.sub { opacity:.65; margin-bottom:24px }
.new { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:36px }
.new a { display:block; padding:20px; border:1px solid var(--line); border-radius:12px; background:var(--bar); text-decoration:none; color:var(--fg); }
.new a:hover { border-color:var(--accent) }
.new .logo { width:38px; height:38px; font-size:18px; line-height:38px; margin-bottom:10px }
.new b { display:block; font-size:16px }
.row { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); }
.row a { flex:1; color:var(--fg); text-decoration:none } .row small { opacity:.55 } .empty { opacity:.5; padding:12px }
.tag { font-size:11px; font-weight:700; background:var(--line); border-radius:4px; padding:1px 6px; font-family:"Helvetica Neue",Helvetica,sans-serif }
</style></head><body><main>
<h1><span class="logo" id="hlogo">F<small>o</small></span><span id="htitle">FreeOffice</span></h1>
<div class="sub" id="sub">Your own documents, spreadsheets, slides, posters and databases.</div>
<div class="new" id="new"></div>
<h3>Recent files</h3><div id="list"></div>
</main>
<script src="common.js"></script>
<script>
const only = window.__FO_APP || new URLSearchParams(location.search).get('app');
try { sessionStorage.setItem('fo-home', location.pathname.split('/').pop() + (only ? '?app=' + only : '')); } catch (e) {}
const show = only && APPS[only] ? [only] : Object.keys(APPS);
if (only && APPS[only]) {
  const a = APPS[only]; document.getElementById('htitle').textContent = 'FreeOffice ' + a.name;
  document.getElementById('hlogo').innerHTML = 'F<small>' + a.mark[1] + '</small>';
  document.getElementById('sub').textContent = a.blurb;
  document.title = 'FreeOffice ' + a.name;
}
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
document.getElementById('new').innerHTML = show.map(t => { const a = APPS[t];
  return `<a href="${a.page}"><span class="logo">F<small>${a.mark[1]}</small></span><b>New ${a.one}</b>${only ? '' : 'FreeOffice ' + a.name}</a>`; }).join('');
function render() {
  const all = show.flatMap(t => Store.list(t).map(f => ({ ...f, t }))).sort((a, b) => b.modified - a.modified);
  document.getElementById('list').innerHTML = all.length ? all.map(f => `<div class="row"><span class="tag">${APPS[f.t].mark}</span><a href="${APPS[f.t].page}?id=${f.id}">${esc(f.title)}</a><small>${new Date(f.modified).toLocaleString()}</small><button data-t="${f.t}" data-id="${f.id}">Delete</button></div>`).join('') : '<div class="empty">Nothing yet — create something above.</div>';
}
document.getElementById('list').onclick = e => { const b = e.target.closest('button'); if (b && confirm('Delete this file permanently?')) { Store.remove(b.dataset.t, b.dataset.id); render(); } };
render();
</script></body></html>
