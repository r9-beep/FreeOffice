<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sheets</title><link rel="stylesheet" href="style.css">
<style>
#fx { display:flex; gap:8px; padding:6px 12px; background:var(--bar); border-bottom:1px solid var(--line); align-items:center; }
#fx input { flex:1; font:inherit; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
#ref { width:60px; text-align:center; font-weight:600; }
#wrap { overflow:auto; height:calc(100vh - 100px); }
table { border-collapse:collapse; font-size:13px; }
th { background:var(--bar); border:1px solid var(--line); position:sticky; top:0; z-index:2; padding:3px 8px; min-width:90px; font-weight:600; }
th.r { position:sticky; left:0; min-width:36px; z-index:1; top:auto; }
td { border:1px solid var(--line); min-width:90px; height:24px; padding:2px 6px; white-space:nowrap; background:var(--bar); cursor:cell; max-width:260px; overflow:hidden; }
td.sel { outline:2px solid var(--accent); outline-offset:-2px; }
td.num { text-align:right; } td.err { color:#d33; }
td input { width:100%; border:0; outline:0; font:inherit; background:transparent; color:inherit; }
</style></head><body>
<div class="top">
  <a class="home" href="index.html">FreeOffice</a>
  <input class="title" id="title" placeholder="Untitled spreadsheet">
  <span class="sep"></span>
  <button id="bold"><b>B</b></button><button id="open">Import CSV</button><button id="csv">Export CSV</button><button id="json">Export JSON</button><button id="clear">Clear</button>
  <span class="status" id="status"></span>
</div>
<div id="fx"><input id="ref" readonly><span>ƒx</span><input id="formula" placeholder="Value or =formula, e.g. =SUM(A1:A5)*2"></div>
<div id="wrap"><table id="grid"></table></div>
<script src="common.js"></script>
<script>
const COLS = 26, ROWS = 100, id = docId('sheets');
const d = Store.load('sheets', id) || { title: '', cells: {}, bold: {} };
const title = document.getElementById('title'), status = document.getElementById('status');
title.value = d.title; document.title = d.title || 'Sheets';
const colName = i => String.fromCharCode(65 + i);
const addr = (c, r) => colName(c) + (r + 1);
let sel = [0, 0], cache = {};

const save = debounce(() => { Store.save('sheets', id, d); document.title = d.title || 'Sheets'; status.textContent = 'Saved ' + new Date().toLocaleTimeString(); });
title.oninput = () => { d.title = title.value; save(); };

function parseRef(s) { const m = /^([A-Z])(\d+)$/.exec(s); return m ? [m[1].charCodeAt(0) - 65, +m[2] - 1] : null; }
function range(a, b) { const A = parseRef(a), B = parseRef(b), out = [];
  for (let r = Math.min(A[1], B[1]); r <= Math.max(A[1], B[1]); r++) for (let c = Math.min(A[0], B[0]); c <= Math.max(A[0], B[0]); c++) out.push(value(addr(c, r)));
  return out; }
function value(a, stack = []) {
  if (a in cache) return cache[a];
  if (stack.includes(a)) throw new Error('#CIRC');
  const raw = d.cells[a];
  let v;
  if (raw == null || raw === '') v = '';
  else if (typeof raw === 'string' && raw[0] === '=') v = evalFormula(raw.slice(1), [...stack, a]);
  else v = raw !== '' && !isNaN(raw) ? Number(raw) : raw;
  return cache[a] = v;
}
const nums = a => a.flat(Infinity).filter(x => typeof x === 'number');
const FN = {
  SUM: (...a) => nums(a).reduce((x, y) => x + y, 0),
  AVERAGE: (...a) => { const n = nums(a); return n.length ? FN.SUM(n) / n.length : 0; },
  MIN: (...a) => Math.min(...nums(a)), MAX: (...a) => Math.max(...nums(a)),
  COUNT: (...a) => nums(a).length, ABS: Math.abs, ROUND: (x, n = 0) => Math.round(x * 10 ** n) / 10 ** n,
  SQRT: Math.sqrt, POWER: Math.pow, IF: (c, a, b) => c ? a : b, CONCAT: (...a) => a.flat(Infinity).join(''),
  UPPER: s => String(s).toUpperCase(), LOWER: s => String(s).toLowerCase(), LEN: s => String(s).length,
};
function evalFormula(src, stack) {
  const strings = [];
  let e = src.replace(/"([^"]*)"/g, (_, s) => { strings.push(s); return `__s${strings.length - 1}__`; });
  e = e.replace(/\b([A-Z]\d+):([A-Z]\d+)\b/g, (_, a, b) => `__R("${a}","${b}")`)
       .replace(/(?<!")\b([A-Z]\d+)\b(?!")/g, (m, a) => `__V("${a}")`)
       .replace(/\b([A-Z][A-Z0-9]*)\(/g, (m, f) => `__F.${f}(`)
       .replace(/(?<![<>=!])=(?!=)/g, '==').replace(/<>/g, '!=').replace(/\^/g, '**').replace(/&/g, '+')
       .replace(/__s(\d+)__/g, (_, i) => JSON.stringify(strings[i]));
  if (/[;{}\[\]`\\]|\b(window|document|fetch|eval|Function|constructor|this)\b/.test(e.replace(/"[^"]*"/g, ''))) throw new Error('#ERR');
  return new Function('__V', '__R', '__F', `return (${e})`)(a => { const v = value(a, stack); return v === '' ? 0 : v; }, (a, b) => range(a, b), FN);
}
function show(a) {
  try { const v = value(a); return { t: v === undefined || (typeof v === 'number' && !isFinite(v)) ? '#ERR' : String(v), n: typeof v === 'number', e: false }; }
  catch (err) { return { t: err.message.startsWith('#') ? err.message : '#ERR', n: false, e: true }; }
}
function render() {
  cache = {};
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const td = cells[r][c], a = addr(c, r);
    if (td.firstChild && td.firstChild.tagName === 'INPUT') continue;
    const s = show(a);
    td.textContent = s.t; td.className = (s.n ? 'num ' : '') + (s.e || s.t[0] === '#' ? 'err ' : '') + (c === sel[0] && r === sel[1] ? 'sel' : '');
    td.style.fontWeight = d.bold[a] ? '700' : '';
  }
}
const grid = document.getElementById('grid'), cells = [], fbar = document.getElementById('formula'), ref = document.getElementById('ref');
let head = '<tr><th class="r"></th>'; for (let c = 0; c < COLS; c++) head += `<th>${colName(c)}</th>`; grid.innerHTML = head + '</tr>';
for (let r = 0; r < ROWS; r++) {
  const tr = grid.insertRow(); cells[r] = [];
  const h = document.createElement('th'); h.className = 'r'; h.textContent = r + 1; tr.appendChild(h);
  for (let c = 0; c < COLS; c++) { const td = tr.insertCell(); td.dataset.c = c; td.dataset.r = r; cells[r][c] = td; }
}
function select(c, r) {
  c = Math.max(0, Math.min(COLS - 1, c)); r = Math.max(0, Math.min(ROWS - 1, r));
  cells[sel[1]][sel[0]].classList.remove('sel'); sel = [c, r];
  cells[r][c].classList.add('sel'); cells[r][c].scrollIntoView({ block: 'nearest', inline: 'nearest' });
  ref.value = addr(c, r); fbar.value = d.cells[addr(c, r)] ?? '';
}
function commit(a, v) { if (v === '' || v == null) delete d.cells[a]; else d.cells[a] = v; save(); render(); }
function edit(c, r, initial) {
  const td = cells[r][c], a = addr(c, r), inp = document.createElement('input');
  inp.value = initial ?? (d.cells[a] ?? ''); td.textContent = ''; td.appendChild(inp); inp.focus();
  if (initial != null) inp.setSelectionRange(inp.value.length, inp.value.length);
  let done = false;
  const finish = (move) => { if (done) return; done = true; const v = inp.value; td.removeChild(inp); commit(a, v); if (move) select(c + move[0], r + move[1]); else select(c, r); grid.focus(); };
  inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); finish([0, e.shiftKey ? -1 : 1]); } else if (e.key === 'Tab') { e.preventDefault(); finish([e.shiftKey ? -1 : 1, 0]); } else if (e.key === 'Escape') { done = true; td.removeChild(inp); render(); grid.focus(); } };
  inp.onblur = () => finish();
}
grid.tabIndex = 0;
grid.onclick = e => { const td = e.target.closest('td'); if (td) select(+td.dataset.c, +td.dataset.r); };
grid.ondblclick = e => { const td = e.target.closest('td'); if (td) edit(+td.dataset.c, +td.dataset.r); };
grid.onkeydown = e => {
  if (e.target.tagName === 'INPUT') return;
  const [c, r] = sel, k = e.key;
  if (k === 'ArrowDown' || k === 'Enter') select(c, r + 1); else if (k === 'ArrowUp') select(c, r - 1);
  else if (k === 'ArrowLeft') select(c - 1, r); else if (k === 'ArrowRight' || k === 'Tab') { e.preventDefault(); select(c + (e.shiftKey ? -1 : 1), r); }
  else if (k === 'Delete' || k === 'Backspace') commit(addr(c, r), '');
  else if (k === 'F2') edit(c, r);
  else if (k.length === 1 && !e.metaKey && !e.ctrlKey) { e.preventDefault(); edit(c, r, k); }
};
fbar.onkeydown = e => { if (e.key === 'Enter') { commit(addr(...sel), fbar.value); grid.focus(); } };
document.getElementById('bold').onclick = () => { const a = addr(...sel); d.bold[a] ? delete d.bold[a] : d.bold[a] = 1; save(); render(); };
document.getElementById('clear').onclick = () => { if (confirm('Clear the whole sheet?')) { d.cells = {}; d.bold = {}; save(); render(); } };
const csvOut = () => { let maxR = 0, maxC = 0; for (const a in d.cells) { const [c, r] = parseRef(a); maxR = Math.max(maxR, r); maxC = Math.max(maxC, c); }
  cache = {}; const rows = []; for (let r = 0; r <= maxR; r++) { const row = []; for (let c = 0; c <= maxC; c++) { const s = show(addr(c, r)).t; row.push(/[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s); } rows.push(row.join(',')); } return rows.join('\n'); };
document.getElementById('csv').onclick = () => download((d.title || 'sheet') + '.csv', csvOut(), 'text/csv');
document.getElementById('json').onclick = () => download((d.title || 'sheet') + '.json', JSON.stringify(d.cells, null, 2), 'application/json');
document.getElementById('open').onclick = () => pickFile('.csv,.txt', (t, n) => {
  d.cells = {}; let r = 0, c = 0, f = '', q = false;
  const push = () => { if (f !== '' && r < ROWS && c < COLS) d.cells[addr(c, r)] = f; f = ''; };
  for (let i = 0; i < t.length; i++) { const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { push(); c++; } else if (ch === '\n') { push(); r++; c = 0; } else if (ch !== '\r') f += ch; }
  push(); d.title = n.replace(/\.\w+$/, ''); title.value = d.title; save(); render(); });
render(); select(0, 0); grid.focus();
</script></body></html>
