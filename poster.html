<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poster</title><link rel="stylesheet" href="style.css">
<style>
#main { display:flex; height:calc(100vh - 50px); }
#stagewrap { flex:1; overflow:auto; padding:30px; background:var(--bg); }
#stage { position:relative; margin:0 auto; transform-origin:top left; background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.35); overflow:hidden; }
.el { position:absolute; cursor:move; user-select:none; box-sizing:border-box; }
.el.text { white-space:pre-wrap; overflow:hidden; word-break:break-word; }
.el.sel { outline:2px solid #3b6cf6; outline-offset:1px; }
.el.editing { cursor:text; user-select:text; outline:2px dashed #3b6cf6; }
.h { position:absolute; width:12px; height:12px; right:-7px; bottom:-7px; background:#3b6cf6; border:2px solid #fff; border-radius:50%; cursor:nwse-resize; display:none; }
.el.sel .h { display:block; }
#panel { width:240px; background:var(--bar); border-left:1px solid var(--line); padding:12px; overflow:auto; font-size:13px; }
#panel h4 { margin:12px 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; opacity:.6 }
#panel label { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:5px 0 }
#panel input[type=number], #panel select, #panel input[type=text] { width:110px; font:inherit; padding:3px 6px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
#panel input[type=color] { width:40px; height:26px; padding:0; border:1px solid var(--line); border-radius:6px; background:none }
.btns { display:flex; flex-wrap:wrap; gap:5px } .none { opacity:.5; margin-top:6px }
@media print { @page { margin:0 } body > :not(#printroot) { display:none !important } #printroot { display:block !important } }
#printroot { display:none }
</style></head><body>
<div class="top">
  <a class="home" href="index.html">FreeOffice</a>
  <input class="title" id="title" placeholder="Untitled poster">
  <span class="sep"></span>
  <button data-add="text">T Text</button><button data-add="rect">▭ Box</button><button data-add="ellipse">◯ Ellipse</button><button data-add="line">╱ Line</button><button id="img">🖼 Image</button>
  <span class="sep"></span>
  <select id="size" title="Page size"></select>
  <select id="zoom" title="Zoom"><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.5">150%</option></select>
  <span class="sep"></span>
  <button id="png">Export PNG</button><button id="pdf">Print / PDF</button><button id="html">Export .html</button>
  <span class="status" id="status"></span>
</div>
<div id="main">
  <div id="stagewrap"><div id="stage"></div></div>
  <div id="panel"></div>
</div>
<div id="printroot"></div>
<script src="common.js"></script>
<script>
const SIZES = { 'A4 portrait': [794, 1123], 'A4 landscape': [1123, 794], 'A3 portrait': [1123, 1587], 'US Letter': [816, 1056], 'Square 1080': [1080, 1080], 'Banner 1500×500': [1500, 500], 'Wide 1920×1080': [1920, 1080] };
const FONTS = ['Helvetica Neue', 'Georgia', 'Times New Roman', 'Courier New', 'Impact', 'Futura', 'Avenir Next', 'Marker Felt'];
const id = docId('poster'), title = document.getElementById('title'), status = document.getElementById('status'), stage = document.getElementById('stage');
const d = Store.load('poster', id) || { title: '', size: 'A4 portrait', bg: '#ffffff', els: [
  { id: 1, type: 'rect', x: 0, y: 0, w: 794, h: 380, fill: '#111111', stroke: '', sw: 0, rad: 0 },
  { id: 2, type: 'text', x: 60, y: 120, w: 674, h: 160, text: 'Your poster title', font: 'Helvetica Neue', size: 84, bold: true, italic: false, color: '#ffffff', align: 'left', fill: '' },
  { id: 3, type: 'text', x: 60, y: 440, w: 674, h: 200, text: 'Double-click any text to edit it.\nDrag to move, use the corner handle to resize.', font: 'Georgia', size: 28, bold: false, italic: false, color: '#222222', align: 'left', fill: '' } ] };
title.value = d.title; document.title = d.title || 'Poster';
let sel = null, nextId = Math.max(0, ...d.els.map(e => e.id)) + 1, zoom = 1;
const save = debounce(() => { d.title = title.value; Store.save('poster', id, d); document.title = d.title || 'Poster'; status.textContent = 'Saved ' + new Date().toLocaleTimeString(); });
title.oninput = save;
const sizeSel = document.getElementById('size'); sizeSel.innerHTML = Object.keys(SIZES).map(s => `<option>${s}</option>`).join(''); sizeSel.value = d.size;
sizeSel.onchange = () => { d.size = sizeSel.value; save(); layout(); };
document.getElementById('zoom').onchange = e => { zoom = +e.target.value; layout(); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function style(e) {
  let s = `left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;`;
  if (e.type === 'text') s += `font:${e.italic ? 'italic ' : ''}${e.bold ? '700' : '400'} ${e.size}px/1.2 '${e.font}',Helvetica,sans-serif;color:${e.color};text-align:${e.align};${e.fill ? 'background:' + e.fill + ';' : ''}`;
  else if (e.type === 'rect' || e.type === 'ellipse') s += `background:${e.fill || 'transparent'};border:${e.sw || 0}px solid ${e.stroke || 'transparent'};border-radius:${e.type === 'ellipse' ? '50%' : (e.rad || 0) + 'px'};`;
  else if (e.type === 'line') s += `border-top:${e.sw || 4}px solid ${e.stroke || '#000'};height:0;`;
  return s;
}
function inner(e) { return e.type === 'text' ? esc(e.text) : e.type === 'image' ? `<img src="${e.src}" style="width:100%;height:100%;object-fit:cover;pointer-events:none;display:block">` : ''; }
function layout() {
  const [w, h] = SIZES[d.size]; stage.style.width = w + 'px'; stage.style.height = h + 'px'; stage.style.background = d.bg;
  stage.style.transform = `scale(${zoom})`; stage.parentElement.style.setProperty('--z', zoom);
  stage.style.marginBottom = (h * (zoom - 1)) + 'px'; stage.style.marginRight = (w * (zoom - 1)) + 'px'; stage.style.marginLeft = zoom < 1 ? 'auto' : '0';
  render();
}
function render() {
  stage.innerHTML = d.els.map(e => `<div class="el ${e.type} ${e.id === sel ? 'sel' : ''}" data-id="${e.id}" style="${style(e)}">${inner(e)}<div class="h"></div></div>`).join('');
  panel();
}
const get = i => d.els.find(e => e.id === i);
function updateEl(e) { const n = stage.querySelector(`[data-id="${e.id}"]`); if (n) { n.style.cssText = style(e); } }

// --- mouse interaction ---
let drag = null;
stage.addEventListener('mousedown', ev => {
  const n = ev.target.closest('.el');
  if (!n) { sel = null; render(); return; }
  if (n.classList.contains('editing')) return;
  const e = get(+n.dataset.id); sel = e.id;
  stage.querySelectorAll('.el').forEach(x => x.classList.toggle('sel', +x.dataset.id === sel)); panel();
  drag = { e, mode: ev.target.classList.contains('h') ? 'resize' : 'move', sx: ev.clientX, sy: ev.clientY, ox: e.x, oy: e.y, ow: e.w, oh: e.h };
  ev.preventDefault();
});
window.addEventListener('mousemove', ev => {
  if (!drag) return; const dx = (ev.clientX - drag.sx) / zoom, dy = (ev.clientY - drag.sy) / zoom, e = drag.e;
  if (drag.mode === 'move') { e.x = Math.round(drag.ox + dx); e.y = Math.round(drag.oy + dy); } else { e.w = Math.max(10, Math.round(drag.ow + dx)); e.h = Math.max(e.type === 'line' ? 0 : 10, Math.round(drag.oh + dy)); }
  updateEl(e);
});
window.addEventListener('mouseup', () => { if (drag) { drag = null; save(); panel(); } });
stage.addEventListener('dblclick', ev => {
  const n = ev.target.closest('.el.text'); if (!n) return; const e = get(+n.dataset.id);
  n.classList.add('editing'); n.contentEditable = 'true'; n.focus();
  const r = document.createRange(); r.selectNodeContents(n); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  n.onblur = () => { e.text = n.innerText.replace(/\n$/, ''); n.contentEditable = 'false'; n.classList.remove('editing'); save(); render(); };
});
document.addEventListener('keydown', ev => {
  if (ev.target.closest('input,select,[contenteditable=true]') ) return;
  const e = get(sel); if (!e) return; const step = ev.shiftKey ? 10 : 1;
  if (ev.key === 'Delete' || ev.key === 'Backspace') { d.els = d.els.filter(x => x !== e); sel = null; save(); render(); ev.preventDefault(); }
  else if (ev.key.startsWith('Arrow')) { if (ev.key === 'ArrowLeft') e.x -= step; if (ev.key === 'ArrowRight') e.x += step; if (ev.key === 'ArrowUp') e.y -= step; if (ev.key === 'ArrowDown') e.y += step; updateEl(e); save(); ev.preventDefault(); }
  else if ((ev.metaKey || ev.ctrlKey) && ev.key === 'd') { dup(); ev.preventDefault(); }
});

// --- adding ---
function add(el) { el.id = nextId++; d.els.push(el); sel = el.id; save(); render(); }
document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
  const t = b.dataset.add, o = 80 + d.els.length * 8 % 120;
  if (t === 'text') add({ type: 'text', x: o, y: o, w: 400, h: 80, text: 'New text', font: 'Helvetica Neue', size: 36, bold: false, italic: false, color: '#111111', align: 'left', fill: '' });
  if (t === 'rect') add({ type: 'rect', x: o, y: o, w: 300, h: 200, fill: '#3b6cf6', stroke: '', sw: 0, rad: 0 });
  if (t === 'ellipse') add({ type: 'ellipse', x: o, y: o, w: 240, h: 240, fill: '#f6a33b', stroke: '', sw: 0 });
  if (t === 'line') add({ type: 'line', x: o, y: o, w: 400, h: 0, stroke: '#111111', sw: 6 });
});
document.getElementById('img').onclick = () => {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
  i.onchange = () => { const f = i.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 500 / im.width); add({ type: 'image', x: 60, y: 60, w: Math.round(im.width * k), h: Math.round(im.height * k), src: r.result }); }; im.src = r.result; }; r.readAsDataURL(f); };
  i.click();
};
function dup() { const e = get(sel); if (e) add({ ...e, x: e.x + 20, y: e.y + 20 }); }

// --- properties panel ---
function panel() {
  const p = document.getElementById('panel'), e = get(sel);
  let h = `<h4>Page</h4><label>Background <input type="color" id="pbg" value="${d.bg}"></label>`;
  if (!e) h += '<div class="none">Select an element to edit it.</div>';
  else {
    h += `<h4>${e.type}</h4><label>X <input type="number" data-k="x" value="${e.x}"></label><label>Y <input type="number" data-k="y" value="${e.y}"></label><label>Width <input type="number" data-k="w" value="${e.w}"></label><label>Height <input type="number" data-k="h" value="${e.h}"></label>`;
    if (e.type === 'text') h += `<h4>Text</h4><label>Font <select data-k="font">${FONTS.map(f => `<option ${f === e.font ? 'selected' : ''}>${f}</option>`).join('')}</select></label><label>Size <input type="number" data-k="size" value="${e.size}"></label><label>Colour <input type="color" data-k="color" value="${e.color}"></label><label>Fill <input type="color" data-k="fill" value="${e.fill || '#ffffff'}"> <button data-clear="fill">none</button></label><label>Align <select data-k="align">${['left', 'center', 'right'].map(a => `<option ${a === e.align ? 'selected' : ''}>${a}</option>`).join('')}</select></label><div class="btns"><button data-t="bold"><b>B</b></button><button data-t="italic"><i>I</i></button></div>`;
    if (e.type === 'rect' || e.type === 'ellipse') h += `<h4>Style</h4><label>Fill <input type="color" data-k="fill" value="${e.fill || '#ffffff'}"> <button data-clear="fill">none</button></label><label>Border <input type="color" data-k="stroke" value="${e.stroke || '#000000'}"></label><label>Border px <input type="number" data-k="sw" value="${e.sw || 0}"></label>${e.type === 'rect' ? `<label>Radius <input type="number" data-k="rad" value="${e.rad || 0}"></label>` : ''}`;
    if (e.type === 'line') h += `<h4>Style</h4><label>Colour <input type="color" data-k="stroke" value="${e.stroke}"></label><label>Thickness <input type="number" data-k="sw" value="${e.sw}"></label>`;
    h += `<h4>Arrange</h4><div class="btns"><button id="front">Bring to front</button><button id="back">Send to back</button><button id="dup">Duplicate</button><button id="del">Delete</button></div>`;
  }
  p.innerHTML = h;
  p.querySelector('#pbg').oninput = ev => { d.bg = ev.target.value; stage.style.background = d.bg; save(); };
  p.querySelectorAll('[data-k]').forEach(i => i.oninput = () => { const k = i.dataset.k; e[k] = i.type === 'number' ? +i.value : i.value; updateEl(e); save(); });
  p.querySelectorAll('[data-clear]').forEach(b => b.onclick = () => { e[b.dataset.clear] = ''; save(); render(); });
  p.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { e[b.dataset.t] = !e[b.dataset.t]; save(); render(); });
  const on = (i, f) => { const n = p.querySelector('#' + i); if (n) n.onclick = f; };
  on('front', () => { d.els = d.els.filter(x => x !== e).concat(e); save(); render(); });
  on('back', () => { d.els = [e].concat(d.els.filter(x => x !== e)); save(); render(); });
  on('dup', dup); on('del', () => { d.els = d.els.filter(x => x !== e); sel = null; save(); render(); });
}

// --- export ---
function pageHTML() { const [w, h] = SIZES[d.size]; return `<div style="position:relative;width:${w}px;height:${h}px;background:${d.bg};overflow:hidden">${d.els.map(e => `<div class="el ${e.type}" style="position:absolute;box-sizing:border-box;${e.type === 'text' ? 'white-space:pre-wrap;word-break:break-word;overflow:hidden;' : ''}${style(e)}">${inner(e)}</div>`).join('')}</div>`; }
document.getElementById('html').onclick = () => download((d.title || 'poster') + '.html', `<!doctype html><meta charset="utf-8"><title>${esc(d.title)}</title><body style="margin:0;background:#888">${pageHTML()}`, 'text/html');
document.getElementById('pdf').onclick = () => {
  const [w, h] = SIZES[d.size]; document.getElementById('printroot').innerHTML = pageHTML();
  let s = document.getElementById('pagesize') || Object.assign(document.createElement('style'), { id: 'pagesize' }); s.textContent = `@page{size:${w}px ${h}px;margin:0}`; document.head.appendChild(s);
  print();
};
function wrap(ctx, text, maxW) { const out = []; text.split('\n').forEach(par => { let line = ''; par.split(' ').forEach(wd => { const t = line ? line + ' ' + wd : wd; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = wd; } else line = t; }); out.push(line); }); return out; }
document.getElementById('png').onclick = async () => {
  const [w, h] = SIZES[d.size], c = document.createElement('canvas'); c.width = w * 2; c.height = h * 2; const ctx = c.getContext('2d'); ctx.scale(2, 2);
  ctx.fillStyle = d.bg; ctx.fillRect(0, 0, w, h);
  for (const e of d.els) {
    ctx.save();
    if (e.type === 'rect' || e.type === 'ellipse' || (e.type === 'text' && e.fill)) {
      ctx.beginPath(); if (e.type === 'ellipse') ctx.ellipse(e.x + e.w / 2, e.y + e.h / 2, e.w / 2, e.h / 2, 0, 0, 7); else ctx.roundRect(e.x, e.y, e.w, e.h, e.rad || 0);
      if (e.fill) { ctx.fillStyle = e.fill; ctx.fill(); } if (e.sw && e.stroke) { ctx.lineWidth = e.sw; ctx.strokeStyle = e.stroke; ctx.stroke(); }
    } else if (e.type === 'line') { ctx.strokeStyle = e.stroke; ctx.lineWidth = e.sw; ctx.beginPath(); ctx.moveTo(e.x, e.y + e.sw / 2); ctx.lineTo(e.x + e.w, e.y + e.sw / 2); ctx.stroke(); }
    else if (e.type === 'image') { await new Promise(r => { const im = new Image(); im.onload = () => { const k = Math.max(e.w / im.width, e.h / im.height), sw = e.w / k, sh = e.h / k; ctx.save(); ctx.beginPath(); ctx.rect(e.x, e.y, e.w, e.h); ctx.clip(); ctx.drawImage(im, (im.width - sw) / 2, (im.height - sh) / 2, sw, sh, e.x, e.y, e.w, e.h); ctx.restore(); r(); }; im.onerror = r; im.src = e.src; }); }
    if (e.type === 'text') {
      ctx.beginPath(); ctx.rect(e.x, e.y, e.w, e.h); ctx.clip();
      ctx.font = `${e.italic ? 'italic ' : ''}${e.bold ? '700' : '400'} ${e.size}px '${e.font}',Helvetica,sans-serif`; ctx.fillStyle = e.color; ctx.textBaseline = 'top';
      ctx.textAlign = e.align; const tx = e.align === 'center' ? e.x + e.w / 2 : e.align === 'right' ? e.x + e.w : e.x;
      wrap(ctx, e.text, e.w).forEach((l, i) => ctx.fillText(l, tx, e.y + i * e.size * 1.2 + (e.size * 1.2 - e.size) / 2));
    }
    ctx.restore();
  }
  c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = (d.title || 'poster') + '.png'; a.click(); }, 'image/png');
};
layout();
</script></body></html>
